<section class="catalogo-container">

    <aside class="filtros">
        <h2>Filtros</h2>

        <button (click)="filtrarCategoria('Todos')">Todos</button>
        <button (click)="filtrarCategoria('Boda de día')">Boda de día</button>
        <button (click)="filtrarCategoria('Boda de noche')">Boda de noche</button>
        <button (click)="filtrarCategoria('Graduación')">Graduación</button>

        <div class="filtro-precio">
            <h3>Precio máximo</h3>

            <input type="range" min="0" max="250" step="10" [value]="precioMaximo" (input)="cambiarPrecio($event)">

            <p>{{ precioMaximo }} €</p>
        </div>
    </aside>

    <section class="catalogo">

        @for (vestido of vestidosFiltrados; track vestido.nombre) {

        <div class="card" [routerLink]="['/detalle', vestido.id]">
            <img [src]="vestido.imagen">

            <div class="info">
                <h2>{{ vestido.nombre }}</h2>
                <p>{{ vestido.categoria }}</p>
                <span>{{ vestido.precio }} €</span>
                <button class="corazon" [class.activo]="esFavorito(vestido)"
                    (click)="cambiarFavorito(vestido); $event.stopPropagation()">
                    {{ esFavorito(vestido) ? '♥' : '♡' }}
                </button>
            </div>
        </div>

        }

    </section>

</section>
